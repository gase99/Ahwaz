<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ahwaz Serverless Code Studio</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="badge-dot"></span>
          <strong>Ahwaz Code Studio</strong>
          <span class="sub-chip">@tgcloud v2.1</span>
        </div>
        <div class="topbar-actions">
          <select id="providerSelect" class="select-pill" title="انتخاب سرویس هوش مصنوعی"></select>
          <select id="modelSelect" class="select-pill" title="انتخاب مدل"></select>
          <button id="btnProviderCfg" class="btn-icon" title="تنظیم کلید و آدرس API">🔑</button>
          <select id="projectSelect" class="select-pill" title="پروژه فعال"></select>
          <button id="btnNewProject" class="btn-icon" title="پروژه جدید">➕</button>
          <button id="btnExportZip" class="btn-primary-sm" title="ارسال ZIP به چت تلگرام">📦 ZIP</button>
        </div>
      </header>

      <div id="cfgModal" class="cfg-panel hidden">
        <div class="cfg-row">
          <strong id="cfgTitle">تنظیمات سرویس هوش مصنوعی</strong>
          <button id="btnSyncOpenCode" class="btn-ghost-sm">🔄 بروزرسانی مدل‌های رایگان OpenCode</button>
        </div>
        <p id="cfgHint" class="cfg-hint"></p>
        <div class="cfg-inputs">
          <input id="cfgBaseUrl" type="url" dir="ltr" placeholder="Base URL (مثلاً https://router.example.com/v1 برای FreeLLMAPI)" />
          <input id="cfgApiKey" type="password" dir="ltr" placeholder="API Key (برای سرویس‌های بدون کلید خالی بگذارید)" />
          <input id="cfgCustomModel" type="text" dir="ltr" placeholder="مدل دلخواه (مثلاً big-pickle یا auto:smart)" />
        </div>
        <div class="cfg-actions">
          <button id="btnSaveCfg" class="btn-accent">💾 ذخیره و فعال‌سازی سرویس</button>
          <button id="btnCloseCfg" class="btn-ghost-sm">بستن</button>
        </div>
      </div>

      <nav class="tabs">
        <button class="tab active" data-tab="agent">🤖 ایجنت کدنویس</button>
        <button class="tab" data-tab="files">📂 فایل‌ها (<span id="fileCount">0</span>)</button>
        <button class="tab" data-tab="editor">💻 ویرایشگر کد</button>
      </nav>

      <main class="panels">
        <!-- Agent Panel -->
        <section id="panel-agent" class="panel active">
          <div id="agentLog" class="chat-feed">
            <div class="msg system">
              👋 به استودیوی کدنویسی <b>Telegram Serverless</b> خوش آمدید!<br />
              پشتیبانی بومی از <b>مدل‌های رایگان OpenCode Zen</b>، <b>FreeLLMAPI / ApiFreeLLM</b>، <b>LLM7 بدون کلید</b>، <b>OpenRouter :free</b>، <b>Groq</b> و <b>Google Gemini</b>.
            </div>
          </div>
          <form id="promptForm" class="prompt-bar">
            <textarea
              id="promptInput"
              rows="2"
              placeholder="دستور کدنویسی را بنویسید (مثلاً: یک وب‌اپ مدیریت تسک بساز و تست کن)..."
            ></textarea>
            <button type="submit" id="btnRunAgent" class="btn-send">اجرا 🚀</button>
          </form>
        </section>

        <!-- Files Panel -->
        <section id="panel-files" class="panel">
          <div class="panel-toolbar">
            <button id="btnCreateFile" class="btn-secondary">📄 ساخت فایل جدید</button>
            <button id="btnRefresh" class="btn-ghost">🔄 بروزرسانی</button>
          </div>
          <ul id="fileList" class="file-list"></ul>
        </section>

        <!-- Code Editor Panel -->
        <section id="panel-editor" class="panel">
          <div class="editor-header">
            <input id="editorPath" type="text" dir="ltr" placeholder="src/index.js" />
            <div class="editor-btns">
              <button id="btnSaveFile" class="btn-accent">💾 ذخیره</button>
              <button id="btnDeleteFile" class="btn-danger">🗑️</button>
            </div>
          </div>
          <textarea id="editorContent" class="code-area" dir="ltr" spellcheck="false" placeholder="// Select a file or create a new one..."></textarea>
        </section>
      </main>
    </div>

    <div id="toast" class="toast hidden"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
