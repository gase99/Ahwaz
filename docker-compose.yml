services:
  # ----------------------------------------------------------------------------
  # 1. Self-Hosted Local Telegram Bot API Server
  #    Removes 50MB limit (supports up to 2000MB), local file streaming & fast webhook/polling
  # ----------------------------------------------------------------------------
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: ahwaz-telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
      TELEGRAM_HTTP_PORT: "8081"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    expose:
      - "8081"
    networks:
      - ahwaz-net

  # ----------------------------------------------------------------------------
  # 2. Ahwaz Telegram Coding Agent (TypeScript + Google Gemini + Telegram Services)
  # ----------------------------------------------------------------------------
  ahwaz-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ahwaz-coding-agent
    restart: unless-stopped
    depends_on:
      - telegram-bot-api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TELEGRAM_API_ROOT: ${TELEGRAM_API_ROOT:-http://telegram-bot-api:8081}
      TELEGRAM_LOCAL_MODE: ${TELEGRAM_LOCAL_MODE:-true}
      TELEGRAM_LOCAL_FILES_DIR: /var/lib/telegram-bot-api
      WORKSPACES_ROOT: /app/workspaces
      DATA_DIR: /app/data
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
    ports:
      - "${SERVER_PORT:-3000}:3000"
    volumes:
      - ./workspaces:/app/workspaces
      - ./data:/app/data
      - telegram-bot-api-data:/var/lib/telegram-bot-api:ro
    networks:
      - ahwaz-net

volumes:
  telegram-bot-api-data:

networks:
  ahwaz-net:
    driver: bridge
